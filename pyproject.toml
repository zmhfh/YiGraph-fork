[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yigraph"
version = "2.0.0"
description = "YiGraph: graph analytics and Analytics-Augmented Generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "YiGraph contributors"}]
dependencies = [
  "networkx>=3.5,<4",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "python-louvain>=0.16,<0.17",
  "PyYAML>=6,<7",
  "pydantic>=2.11,<3",
  "mcp>=1.16,<2",
]

[project.optional-dependencies]
engine = [
  "setuptools>=65,<81",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "openai>=1.93,<2",
  "ollama>=0.5,<0.6",
  "llama-index-core==0.12.46",
  "llama-index-legacy==0.9.48.post4",
  "llama-index-vector-stores-milvus==0.8.5",
  "llama-index-llms-ollama==0.6.2",
  "llama-index-llms-openai==0.4.7",
  "llama-index-embeddings-huggingface==0.5.5",
  "llama-index-embeddings-openai==0.3.1",
  "llama-index-readers-file==0.4.9",
  "sentence-transformers==5.0.0",
  "transformers==4.53.1",
  "pymilvus>=2.5,<2.6",
  "nebula3-python>=3.8,<4",
  "neo4j>=4.4,<5",
  "scikit-learn>=1.6,<2",
  "sympy>=1.13,<2",
  "tqdm>=4.67,<5",
  "prettytable>=3.16,<4",
  "beautifulsoup4>=4.13,<5",
  "PyMuPDF>=1.25,<2",
  "markitdown[docx,pdf]>=0.1,<1",
]
pyg = ["torch>=2.7,<3", "torch-geometric>=2.6,<3"]
dev = ["build>=1.2", "twine>=6", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/iDC-NEU/YiGraph"
Documentation = "https://idc-neu.com/YiGraphDocs/"
Issues = "https://github.com/iDC-NEU/YiGraph/issues"

[project.scripts]
yigraph = "yigraph.cli:main"

[tool.setuptools]
include-package-data = false
# Required by the legacy EntitiesDB import; do not ship its demo configs/logs.
py-modules = ["aag.expert_search_engine.data_process.openai_extractor.gpt_extract_triplets"]

[tool.setuptools.packages.find]
include = ["yigraph*", "aag*"]
exclude = ["aag.expert_search_engine.data_process*", "aag.data_pipeline.knowledge_ingestion*", "aag.datasets*"]
namespaces = true

[tool.setuptools.package-data]
aag = [
  "knowledge_base/*.yaml",
  "computing_engine/config_servers.yaml",
  "computing_engine/networkx_server/generated_*.json",
  "data_pipeline/data_transformer/dataset_schemas/*.yaml",
  "datasets/dataset_schemas/*.yaml",
  "datasets/dataset_schemas/*/*.yaml",
  "datasets/data/AMLSim1K/graph/accounts.csv",
  "datasets/data/AMLSim1K/graph/transactions.csv",
  "datasets/data/AMLSim1K/process_graph/*.csv",
  "datasets/data/DocumentDemo/text/*.md",
  "datasets/data/DocumentDemo/text/*.csv",
]
yigraph = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
