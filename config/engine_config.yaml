# Set OPENAI_API_KEY and YIGRAPH_NEO4J_PASSWORD locally before running.
version: 2.0.0
execution:
  mode: react
  react:
    max_steps: 16
    max_retries_per_action: 2
    observation_chars: 6000
    timeout_seconds: 600
    record_dag: true
reasoner:
  react:
    adapters: {}
  llm:
    provider: openai
    ollama:
      model_name: llama3.1:70b
      device: cuda:0
      timeout: 150000
      port: 11434
    openai:
      base_url: https://api.deepseek.com/
      api_key: ''
      model: deepseek-flash
    backend: {}
    default_adapter: null
    adapters: {}
retrieval:
  database:
    vector:
      host: localhost
      port: 19530
    neo4j:
      enabled: true
      uri: bolt://127.0.0.1:7687
      user: neo4j
      password: ''
      password_file: ''
  embedding:
    model_name: BAAI/bge-large-en-v1.5
    batch_size: 20
    chunk_size: 512
    chunk_overlap: 20
    device: cpu
mode: react
