# Historical knowledge entries without executable YiGraph tasks. Excluded from the active algorithm list.
- id: leiden_communities
  task_type_id: Clustering & Community
  Deployment_method:
    support_engine: networkx
    input_schema:
      parameters:
        G:
          type: NetworkX graph
          description: Parameter 'G' for leiden_communities
          required: true
        weight:
          type: string or None, optional (default="weight")
          description: The name of an edge attribute that holds the numerical value used as a weight. If None then each edge
            has weight 1.
          default: weight
        resolution:
          type: float, optional (default=1)
          description: If resolution is less than 1, the algorithm favors larger communities. Greater than 1 favors smaller
            communities.
          default: 1
        max_level:
          type: int or None, optional (default=None)
          description: The maximum number of levels (steps of the algorithm) to compute. Must be a positive integer or None.
            If None, then there is no max level and the algorithm will run until converged.
          default: null
        seed:
          type: integer, random_state, or None (default)
          description: Indicator of random number generation state. See :ref:`Randomness<randomness>`.
          default: null
    output_schema:
      type: any
      description: list A list of disjoint sets (partition of `G`). Each set represents one community. All communities together
        contain all the nodes in `G`.
    graph_type:
      directed: false
      multigraph: false
      weighted: true
      heterogeneous: false
  Application_scenario: The leiden_communities algorithm is commonly applied in social networks, biological networks, and
    information networks to uncover community structures. It is particularly useful for detecting clusters of closely connected
    nodes, such as user groups in social media or functional modules in biological networks. For example, in a social network,
    this algorithm can help to identify communities of users who interact frequently with one another.
  Tuning_Mechanisms:
    weight: Adjusting the weight parameter allows users to specify a particular edge attribute for edge weights. By doing
      so, communities may reflect more meaningful relationships depending on the weights assigned, thus affecting the resulting
      community structure.
    resolution: Changing the resolution parameter alters the size of the communities detected. A resolution less than 1 tends
      to produce larger communities, while a resolution greater than 1 results in smaller, more granular communities, allowing
      for tailored detection of community structures based on specific needs.
  Principles:
    description: The leiden_communities algorithm operates on both directed and undirected graphs, using a multi-level optimization
      approach to partition the graph into communities based on edge weights. It maximizes modularity, promoting the formation
      of dense connections within communities while minimizing connections between them. The algorithm requires a graph as
      input and can run until convergence or a specified maximum number of levels is reached, with complexity influenced by
      the resolution parameter.
    time_complexity: O(V log V) (Empirical)
  solvable_questions:
  - Use the Leiden algorithm to detect communities and output the partition results.
  - Run the Leiden algorithm to guarantee community connectivity and return the community list.
  - Partition communities more finely than Louvain and provide results using the Leiden method.
  - Please find a set of higher-quality community structures that guarantee each group is internally connected.
  - In biological network analysis, identify functional modules that are structurally tight and have no internal breaks.
  - Use a method faster and more stable than Louvain to partition the network into high-quality clusters.
  - Avoid creating "bad communities" that are grouped together but actually disconnected; please find structurally rigorous
    subgroups.
  - Perform refined slicing on this large-scale network to ensure that every partitioned community is topologically reasonable.
- id: spectral_modularity_bipartition
  task_type_id: Clustering & Community
  Deployment_method:
    support_engine: networkx
    input_schema:
      parameters:
        G:
          type: graph
          description: A NetworkX graph.
          required: true
    output_schema:
      type: tuple of sets
      description: A pair of sets of nodes representing a bipartition of the graph.
    graph_type:
      directed: false
      multigraph: false
      weighted: false
      heterogeneous: false
  Application_scenario: The spectral_modularity_bipartition algorithm is used to split a graph into two communities based on the spectrum of the modularity matrix of the graph. It is suitable for graph bipartition tasks where one wants a spectral method for community separation rather than heuristic modularity optimization or label propagation.
  Tuning_Mechanisms:
    graph_structure: This function has no explicit tunable parameters in the documented interface. The resulting bipartition is determined by the structure of the input graph.
  Principles:
    description: The spectral_modularity_bipartition algorithm returns a bipartition of the nodes based on the spectrum of the modularity matrix of the graph.
    time_complexity: The NetworkX reference page does not explicitly state the time complexity.
  solvable_questions:
    - Compute a spectral modularity bipartition for the current graph.
    - Split the nodes of the graph into two communities using a spectral method.
    - Return a bipartition of the graph based on the spectrum of the modularity matrix.
    - In the current network, how can the nodes be divided into two communities by spectral modularity analysis?
    - In the social graph, which two groups are identified by a spectral bipartition method?
    - In the collaboration graph, compute a two-way community split using the modularity spectrum.
    - In the interaction network, find a bipartition that reflects spectral community structure.
    - Compare a spectral bipartition with modularity-based or label-propagation-based communities.
  url: https://doi.org/10.1073/pnas.0601602103

- id: gcnconv
  task_type_id: Graph Learning
  Deployment_method:
    support_engine: pyg
    input_schema:
      parameters:
        in_channels:
          type: int, optional (default=-1)
          description: Input node feature dimension; -1 infers the dimension from provided or generated node features.
          default: -1
        out_channels:
          type: int, optional (default=16)
          description: Output embedding dimension produced by the PyG convolution layer.
          default: 16
        mode:
          type: string, optional (default=train)
          description: Execution mode, either train for self-supervised embedding fitting or infer for a forward pass.
          default: train
        node_features:
          type: list, optional
          description: Optional node feature matrix. If omitted, graph-derived degree features are used.
          default: null
        epochs:
          type: int, optional (default=100)
          description: Number of optimization epochs used when mode is train.
          default: 100
        lr:
          type: float, optional (default=0.01)
          description: Learning rate used when mode is train.
          default: 0.01
    output_schema:
      type: dictionary
      description: Node embeddings and, in train mode, loss history and final loss.
    graph_type:
      directed: both
      multigraph: false
      weighted: false
      heterogeneous: false
  Application_scenario: GCNConv is used for semi-supervised graph representation learning, node classification, and embedding generation on citation, social, transaction, and knowledge graphs where neighborhood smoothing is useful.
  Tuning_Mechanisms:
    out_channels: Controls the embedding capacity; larger values can capture richer structure but increase memory and overfitting risk.
    epochs: More epochs can improve fitting quality but increase runtime.
    lr: Higher learning rates train faster but may destabilize optimization.
  Principles:
    description: GCNConv applies graph convolution by aggregating normalized neighbor information and transforming node features into learned embeddings.
    time_complexity: O(E * F_out + V * F_in * F_out) per layer
  solvable_questions:
    - Generate node embeddings from the current graph using a GNN convolution layer.
    - Run graph representation learning with optional node features.
    - Compare embedding dimensions by changing out_channels.
    - Train a message-passing layer and inspect final training loss.
    - Produce node representations for downstream classification or clustering.
    - Infer node embeddings without training when model parameters are initialized.

